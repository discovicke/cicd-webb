name: Stylelint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create config if missing
        run: |
          if [ ! -f .stylelintrc.json ]; then
            echo '{ "extends": ["stylelint-config-standard"] }' > .stylelintrc.json
          fi

      - name: Run Stylelint
        run: npx stylelint "**/*.css" --ignore-pattern "node_modules/**"
